[project]
name = "agent-challenge"
version = "0.2.0"
description = "Renewal-risk reporting pipeline (deterministic + single LLM synthesis)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/challenge"]
